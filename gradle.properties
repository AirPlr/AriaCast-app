# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Caches task outputs so unchanged tasks (local or, if ever wired to a remote cache,
# shared) are fetched instead of re-run.
org.gradle.caching=true
# Caches the result of the configuration phase itself, skipping it on unchanged
# subsequent builds - this project's own builds spent it re-evaluating gradle.properties,
# both build.gradle.kts files, and plugin application on every invocation.
org.gradle.configuration-cache=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Required while this module applies the Kotlin Android plugin explicitly (for
# kotlinx-serialization support): AGP's built-in Kotlin compilation, the new default,
# registers its own "kotlin" extension and conflicts with the plugin's.
android.builtInKotlin=false
# The classic org.jetbrains.kotlin.android plugin (used above instead of AGP's built-in
# Kotlin) does not support AGP 9's new DSL and fails to apply without this - confirmed
# against Kotlin Gradle Plugin 2.2.10-2.3.0, all of which reject android.newDsl=true with
# "not compatible with AGP's 9.0 new DSL" and point back at this flag as the fix. Revisit
# once either side of that incompatibility is resolved upstream.
android.newDsl=false
