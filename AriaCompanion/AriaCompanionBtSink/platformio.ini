; ============================================================
; AriaCast BT Bridge — Scheda A
; ============================================================
; Riceve audio A2DP via Bluetooth classico e lo mette in uscita
; su I2S fisico come MASTER, sempre a 48 kHz stereo 16-bit
; (ricampionato internamente qualunque sia il rate negoziato
; dalla sorgente BT — tipicamente 44100 o 48000 Hz).
;
; QUESTA SCHEDA NON USA MAI IL WIFI. Nessuna inizializzazione
; WiFi è presente nel codice: il radio è dedicato al 100% al
; Bluetooth classico, per evitare i problemi di coesistenza
; BT/WiFi (switching, glitch audio, drop) che condividerebbero
; altrimenti lo stesso hardware radio 2.4 GHz.
;
; RICHIEDE un ESP32 con Bluetooth CLASSICO (BR/EDR): va bene un
; qualsiasi WROOM-32 / WROVER-32 "originale". ESP32-S3/C3/C6
; NON funzionano qui: hanno solo BLE, non A2DP.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    pschatzmann/ESP32-A2DP @ ^1.8.6
    pschatzmann/arduino-audio-tools @ ^1.1.1
