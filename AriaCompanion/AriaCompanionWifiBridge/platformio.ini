; ============================================================
; AriaCast WiFi Sender — Scheda B
; ============================================================
; Legge audio PCM da I2S (come SLAVE, clock fornito dalla
; Scheda A) a 48 kHz stereo 16-bit fisso e lo inoltra come
; Sender AriaCast via WebSocket, secondo la spec:
; https://github.com/AriaCast/AriaCast-Protocol-Spec
;
; QUESTA SCHEDA NON USA MAI IL BLUETOOTH. Il radio è dedicato
; al 100% al WiFi.
;
; Va bene ESP32-S3 (come richiesto) oppure un ESP32 classico:
; qui non serve BT, quindi anche l'S3 (solo BLE) è perfetto.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_HAS_PSRAM

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.1.0
